    reason: 'tdp 不清楚：config.yaml「不合的值換成預設值並說一聲」，型別不對、pin_hash 不是 bcrypt hash 才算讀不了（task 6）。tdp E3「app 自己的設定、狀態、資料讀不了（格式錯、檔案壞掉、沒有權限……原因不分）時，app 不在這個狀態下繼續操作，啟動時開一個 confirm」；YAML 讀得進來、只有某個值不合規則算不算「讀不了」，tdp 沒寫（P5 把「輸入的值合不合規則」交給 app，E3 又寫原因不分）；換成預設值繼續、之後寫回能不能蓋掉使用者原本寫的值，「說一聲」用 toast 還是 App Log，也沒寫'
