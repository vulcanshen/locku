version: 2

project_name: locku

builds:
  - main: ./cmd/locku
    binary: locku
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/vulcanshen/locku/internal/version.Version={{.Version}}
    goos:
      # unix-first, like the rest of the u-family — no windows target: the
      # lock owns a Unix tty in raw mode, and tmux / screen are Unix.
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true

# A formula, not a cask, like kbu / filu / sshu / webu: a formula binary is
# never stamped com.apple.quarantine, so an unsigned binary runs clean.
#
# No dependencies: a single static binary. It drives whatever tty it is
# given; tmux and screen are what call it, not what it needs.
brews:
  - repository:
      owner: vulcanshen
      name: homebrew-tap
      # One token for everything, GITHUB_TOKEN (user, 2026-09-25): a
      # release run by hand takes the shell's; the workflow hands it a
      # PAT when one is set, since the built-in token cannot write to the
      # tap repository.
      token: "{{ .Env.GITHUB_TOKEN }}"
    homepage: "https://github.com/vulcanshen/locku"
    description: "screensaver with a PIN for the terminal (u-family) — tmux lock-command, screen LOCKPRG, or any tty: an LED-board clock, a dino run, or a program of your own; any key asks for the PIN"
    caveats: |
      `locku` is the settings screen: the PIN, the savers and their
      profiles, and Integration › tmux / screen — turn `activate` on
      there and locku writes its block into ~/.tmux.conf (applied to a
      running server too) or ~/.screenrc plus your shell rc (LOCKPRG).
      Without a PIN the lock is a screensaver that any key ends. A PIN
      forgotten: `locku pin reset`, from any shell of your own.

      A Nerd Font terminal profile is required: the board's pixels are
      Nerd Font glyphs. macOS and Linux (WSL too); Windows is not
      supported.
    test: |
      system "#{bin}/locku", "version"
