id: 5
from: v1.2.16
to: v1.2.16
tasks:
  - id: 1
    spec: 1
    request: '`locku lock` 接管整個終端機，顯示啟用中的 profile 的螢幕保護；作為 tmux 的 lock-command、screen 的 LOCKPRG，或在裸 tty 直接執行'
    tdp: [tdp P5, tdp K1, tdp E1, tdp E5]
    remark:
      - '鎖定畫面不在 TUI 裡，不是 surface（tdp K1、P5 的例子就是 locku 的螢幕保護與 PIN 框）：畫面與按鍵 app 自行決定'
      - '`-S`、`-t` 是 tmux 整合寫進 lock-command 的；screen 用 `SCREEN-LOCK` 這個名字、不帶參數執行鎖，locku 認得這個名字'
      - 啟動時先問終端機 icon 佔幾格（tdp E5），再丟掉終端機裡在鎖之前就在等的輸入
  - id: 2
    spec: 1
    request: 任何鍵叫出 PIN 框，那個鍵不算輸入；Enter 送出、Esc 回螢幕保護、Backspace 清掉打的字；PIN 對了終端機回來
    tdp: [tdp P5, tdp K1, tdp password.2, tdp password.4, tdp popup.7, tdp F8, tdp E5]
    remark:
      - PIN 框用 password 的「解鎖」長相：每個字一顆 ●，置中往兩側長（tdp password.2 的例子就是 locku）
      - PIN 框疊在還在動的螢幕保護上，底下淡化（tdp F8）
      - 鎖著時 PIN 在別處被重設，下一鍵就認得新 PIN
  - id: 3
    spec: 2
    request: 錯誤的 PIN 寫 wrong PIN，馬上可以重新輸入；連錯幾次進入冷卻倒數；幾秒沒按鍵 PIN 框自己收起
    tdp: [tdp P5, tdp K1, tdp password, tdp popup.7]
    remark:
      - 次數、冷卻秒數、逾時秒數是 preference 的 wrong_pin_attempts、wrong_pin_attempt_cooldown、pin_prompt_timeout（預設 0 關、30、30）
      - 冷卻的倒數寫在錯誤列（tdp popup.7、password 的「錯太多次而暫停收值時」，例子就是 locku）
      - 輸錯一次不再吞掉 1 秒的輸入（user 2026-11-18）：點點清空，下一個鍵就是新的 PIN；wrong PIN 留在錯誤列，到下一次 Enter 檢查才換（tdp popup.7「兩次檢查之間不動」）
      - 什麼都沒打就按 Enter 不算一次錯（user 2026-11-18）：錯誤列寫必填的錯 `PIN can't be empty`（tdp popup.7「必填」），連按 Enter 不會把次數用完
  - id: 4
    spec: 1
    request: '鎖定畫面的狀態列寫 `user@host · locked since HH:MM`，可以關掉；沒設 PIN 時標明 `no PIN · any key unlocks`'
    tdp: [tdp P5, tdp K1, tdp components.5]
    remark:
      - preference 的 show_status 關掉狀態列
  - id: 5
    spec: 1
    request: 鎖只在三種情況結束：PIN 正確、沒設 PIN 時任何鍵、終端機消失；Ctrl-C、Ctrl-Z、Ctrl-\ 只是按鍵，SIGINT、SIGTERM、SIGHUP 一律忽略，panic 後鎖定畫面重新升起
    tdp: [tdp P5, tdp K1]
    remark:
      - 鎖定畫面不是 TUI 的 surface，K9 的離開鍵不套用在這裡（tdp K1）
  - id: 6
    spec: 4
    request: 沒設 PIN、或 config 讀不到時一律 fail open：螢幕保護照常顯示、狀態列說明原因、任何鍵結束
    tdp: [tdp E3, tdp P5, tdp K1, tdp E3-36]
    remark:
      - profiles.yaml 讀不了時顯示預設的 clock，照樣要 PIN
      - 鎖定畫面不在 TUI 裡：讀不了自己的檔時怎麼繼續由 app 決定，要守的是不動任何檔案（不做 .bak、不重寫）、讓使用者看到哪個檔讀不了與原因；下次開設定畫面照常問 MOVE ASIDE（tdp E3「不在 TUI 裡的畫面」，v1.2.16，user 2026-11-18 在 terminu 定；E3-36）。locku 照沒有 PIN 處理、狀態列寫原因
  - id: 7
    spec: 1
    request: clock：整個終端機是一面 LED 點陣板，用 3 × 7 或 3 × 5 像素字型畫時間與日期，可以直排、三種 size，塞不下就逐步省略
    tdp: [tdp P5, tdp E4]
    remark:
      - 每個像素是一個 Nerd Font 方塊（nf-fa-square），暗格是 profile 的 bg、亮格是 fg
      - 設定：layout、size、font、time、date、bg、fg；只重畫有變的像素，用 shuffle 的方式揭露
  - id: 8
    spec: 1
    request: runner：Chrome 的離線小恐龍當螢幕保護，地面與障礙向左捲，跑者自己跳過去，無限循環
    tdp: [tdp P5, tdp E4]
    remark:
      - 設定：participants（一隻或兩隻、大或小）、character（t-rex、cat、rabbit、giraffe、ghost）、scene（grassland、desert、city）、background（day、night、time-shifting）
      - 天空是它自己的漸層：白天有太陽、夜晚有月亮，time-shifting 三分鐘一天
  - id: 9
    spec: 1
    request: bounce：一個裝著時間的框在板子上飄，撞到邊反彈換顏色，撞進角落把所有顏色閃一輪
    tdp: [tdp P5, tdp E4]
    remark:
      - 設定：speed（slow 到 super-fast 五段）、time（HH:MM 或 HH:MM:SS）；顏色是它自己的
  - id: 10
    spec: 1
    request: snake：老 Nokia 的貪食蛇自己玩，永遠不撞到自己，填滿整面後重來
    tdp: [tdp P5, tdp E4]
    remark:
      - 唯一的設定是 speed（五段）；顏色是它自己的
  - id: 11
    spec: 1
    request: tetromino：自己玩的俄羅斯方塊，整個畫面就是井，接下來的方塊排在右邊，堆到頂就結束、2 秒後重開
    tdp: [tdp P5, tdp E4]
    remark:
      - 唯一的設定是 speed（五段）；顏色是它自己的
  - id: 12
    spec: 1
    request: pets：室外的貓自己找地方去，走、跳、爬樹，坐一會兒、睡覺，再出發
    tdp: [tdp P5, tdp E4]
    remark:
      - 設定：animals（目前只有 cats）、count（1 到 5）、scene（目前只有 outdoor）
  - id: 13
    spec: 1
    request: custom：使用者自己的程式當螢幕保護，經 sh -c 跑；按鍵永遠到不了它，PIN 框直接疊在還在動的畫面上，解鎖時程式跟鎖一起結束
    tdp: [tdp P5, tdp K1, tdp E5]
    remark:
      - 程式跑在 locku 開的 pty 上，輸出原樣直通；locku 替它設好 TERMINU__ICON_WIDTH 與 TERMINU__POWERLINE_WIDTH（tdp E5）
  - id: 14
    spec: 1
    request: 設定畫面有兩個 panel：[1] 側欄，[2] 游標那列的內容，一列一個值；Tab、1、2 在兩邊移動
    tdp: [tdp screen.1, tdp screen.2, tdp panel.1, tdp panel.5, tdp panel.11, tdp panel.12, tdp panel.13, tdp K2, tdp K3, tdp L1, tdp L4, tdp screen.7, tdp components.4, tdp K1]
    remark:
      - |
        配置：
        ┏ [1] LOCKU ━━━━━━━━━┓┌ [2] clock ──────────────┐
        ┃ PROFILES           ┃│ PROPERTY  VALUE         │
        ┃ ● runner           ┃│ NAME      clock         │
        ┃   clock            ┃│ SAVER     clock         │
        ┃ SAVERS             ┃│ LAYOUT    ◉ row         │
        ┃   clock …          ┃│           ○ column      │
        ┃ INTEGRATION        ┃│ …                       │
        ┃   tmux             ┃│                         │
        ┃   screen           ┃│                         │
        ┃ SETTINGS           ┃│                         │
        ┃   preference       ┃│                         │
        ┗━ Enter:edit ━━━━━━━┛└─ Enter:edit ────────────┘
        Space:menu ?:help !:log Tab|1–2:panels q:quit
      - '[1] 是分組的清單（PROFILES、SAVERS、INTEGRATION、SETTINGS，tdp panel.11）；[2] 是 [1] cursor 那一列的明細，一列一個值（tdp panel.12、panel.13）'
      - '[2] 的 label 就是那一筆的名字，照原樣寫（`[2] clock`、`[2] tmux`；tdp components.4、panel.13），不寫種類（user 2026-09-25）'
      - '[1] 上 Enter 進 [2]；[2] 上 Enter 編輯那一列（tdp K3）'
      - 終端機小於 40 × 15 時畫面上說明，拉大就回來（tdp screen.7）
  - id: 15
    spec: 1
    request: Profiles：有名字的螢幕保護設定，● 是啟用中的；a 設為啟用、D duplicate、r rename、X delete，複製或新增時用灰字提議一個沒人用的名字，建好後直接進它的 [2]
    tdp: [tdp panel.5, tdp panel.7, tdp M2, tdp M5, tdp M6, tdp input.5, tdp input.6, tdp text, tdp confirm, tdp P5, tdp K3, tdp note.7]
    remark:
      - 啟用中的那個前面畫 Green ●，畫在標記欄（tdp panel.7 的例子就是 locku）
      - 啟用中的與最後一個不能刪，刪除的動作停用（tdp M6）
      - 刪除前用 confirm 問（tdp confirm）
  - id: 16
    spec: 1
    request: profile 的 [2] 是它的設定、saver 的 [2] 是說明加預設值；選項少的原地選、多的開清單選、開關原地切換、顏色在顏色選擇器裡選；每一列一設定就寫檔
    tdp: [tdp panel.12, tdp panel.13, tdp radio, tdp select, tdp checkbox, tdp color-picker, tdp input.10, tdp P5, tdp text, tdp note.7]
    remark:
      - 顏色選擇器裡舊的顏色與新的並排，紅、綠、藍用 hex（tdp color-picker 的例子就是 locku 的配色）
      - 改 saver 的預設值不動既有的 profile；之後用這種 saver 新增的 profile 從預設值開始（n）
  - id: 17
    spec: 1
    request: 預覽鎖定畫面：[1] 上 p、任何 [2] 上 P，就地看那個 profile 或 saver 的鎖定畫面，任意鍵回來，不驗 PIN
    tdp: [tdp P5, tdp K1, tdp M3, tdp M5, tdp note.7]
    remark:
      - 不是 profile 或 saver 的 [2] 上，預覽啟用中的 profile；custom 的預覽把終端機整個交給程式，直到按鍵
  - id: 18
    spec: 1
    request: 'Settings › preference 的 PIN：4 到 12 個字元；已設時先驗目前的再輸入新的，框裡現有的 PIN 是 8 顆灰點，直接 Enter 保留，Backspace 再 Enter 拿掉；每一步疊在上一步上面，Esc 退回上一步'
    tdp: [tdp password, tdp input.5, tdp K4, tdp F4, tdp popup.7, tdp note.7]
    remark:
      - 新 PIN 打兩次確認（NEW PIN → CONFIRM PIN），是 app 的流程（tdp password 的例子就是 locku）
      - PIN 存成 bcrypt hash
  - id: 19
    spec: 3
    request: 'Settings › preference 的其他值：啟用的 profile、show_status、pin_prompt_timeout、wrong_pin_attempts、wrong_pin_attempt_cooldown、input_tab_width；數字框空著就是預設值'
    tdp: [tdp panel.12, tdp number, tdp checkbox, tdp select, tdp components.5, tdp E3, tdp popup.7, tdp color.2, tdp note.7, tdp input.10, tdp radio]
    remark:
      - input_tab_width 是拿來讀的字（太長的 setup 報告、App Log）裡一個 Tab 佔幾格（tdp components.5）；跟每個值一樣，確定了就生效（tdp panel.12）
      - 啟用的 profile 名字找不到時，那一列的 label 畫 Red（tdp panel.12、color.2）
      - 啟用的 profile 是從使用者自己建的 profile 裡選，數量會變，所以不管有幾個一律開 select（tdp radio.1，v1.2.15 照 tdp #16 定的）；locku 自己定的固定選項才畫 radio
  - id: 20
    spec: 3
    request: 'Integration › tmux：activate、config file path、lock-after-time、bind-key、lock（lock-server 或 lock-session）；activate 打開、確認後，設定寫進 locku 自己的 locku.tmux.conf，使用者的檔只多一行去讀它，跑著的 tmux server 立刻收到'
    tdp: [tdp P5, tdp confirm, tdp checkbox, tdp text, tdp number, tdp radio, tdp toast.2, tdp note.1, tdp E3, tdp input.6, tdp components.5, tdp panel.12, tdp form.9, tdp note.7, tdp note.3, tdp note.2]
    remark:
      - 使用者的檔只碰兩個標記之間的區塊，那一行尾巴 `# locku`；那一行從家目錄寫起，同一份 dotfiles 放到別台也是同一行
      - 開著的時候任何一列一改就重寫 locku 的檔，不再動使用者的；關掉就拿掉那一行、刪掉 locku 的檔，跑著的也一併拿掉
      - 路徑沒填時 activate 按不下去，不猜；路徑那一列提議常見的檔（~/.tmux.conf）
      - 寫了什麼放得進三列就用 Success toast 說，放不下就開成功報告：唯讀的 viewer，標題寫做了什麼（ACTIVATED — tmux），Enter 與 Esc 都能關，以 Success 記進 App Log（tdp toast.2、note.1、note.3，v1.2.15 照 tdp #17 定的）
      - 外部程式（tmux、screen）印了好幾行時，報告只放最後一行（原因），全文記進 App Log（tdp components.5）
  - id: 21
    spec: 1
    request: 'Integration › screen：activate、config file path、idle、bind；設定寫進 locku 自己的 locku.screenrc，使用者的 screenrc 與 shell rc（LOCKPRG）各多一段'
    tdp: [tdp P5, tdp confirm, tdp checkbox, tdp text, tdp number, tdp E3, tdp input.6, tdp panel.12]
    remark:
      - screen 的鎖定程式只從啟動它的 shell 環境讀，所以 shell rc（zsh、bash、fish）也寫 `export LOCKPRG=…`
      - 已在跑的 screen session 要 detach 後從新 shell 重新 attach 才有，設定畫面會說明
  - id: 22
    spec: 1
    request: 'tmux 裡 `prefix :` 打 locku 就鎖整台 server 的 client；鎖著的時候 attach 進來或切換 session 一樣落在鎖上，直到 PIN 解開；閒置 lock-after-time 秒自己鎖、bind-key 填了 prefix 加那個鍵也鎖'
    tdp: [tdp P5]
    remark:
      - 鎖著的期間 server（lock-session 時是那個 session）標成鎖住；終端機消失時標記留著，下一個進來的 client 會遇到鎖
  - id: 23
    spec: 1
    request: '命令列：`locku` 開設定畫面、`locku lock` 鎖、`locku pin reset`、`locku version` 印版本、`locku help` 印用法；不認得的指令說一聲'
    remark:
      - '`locku version` 只印版號（發布版 `vX.Y.Z`、本機版 `dev`；harness project.4）'
    tdp: [tdp E1, harness project.4]
  - id: 24
    spec: 4
    request: '`locku pin reset`：先問 [y/N]，再要登入密碼，然後產生一組新的八位數 PIN、覆蓋舊的、顯示一次；每次成功或被拒都記在資料目錄，不含 PIN；config.yaml 或 profiles.yaml 讀不了時什麼都不問、什麼都不寫，說是哪個檔、為什麼'
    tdp: [tdp E3, tdp P5, tdp E1, tdp E3-35, tdp E3-37]
    remark:
      - 帳號是 locku 唯一的邊界，所以用登入密碼驗證（tdp P5：功能邏輯）
      - 沒有畫面的指令碰到讀不了的檔：什麼都不碰，路徑與原因寫到 stderr，非零結束（tdp E3）
      - 碰到值不合規則或不合的 profile：跟有畫面時一樣複製成 .bak、重寫檔案，那句話寫到 stderr，繼續 reset（tdp E3，v1.2.15）
      - config.yaml 的 profile 指到沒有的 profile：不動檔案，那句話寫到 stderr，繼續 reset（tdp E3，v1.2.16；E3-35、E3-37）
  - id: 25
    spec: 4
    request: '設定放 ~/.config/locku/config.yaml（$XDG_CONFIG_HOME、$LOCKU__CONFIG 可改），profile 放 ~/.locku/data/profiles.yaml（$LOCKU__DATA）；原子寫入、mode 0600、標明自己的 version，舊版的檔第一次讀到就轉成新格式'
    tdp: [tdp E2, tdp E3, tdp F5, tdp note.6, tdp note.7, tdp toast.2, tdp P5, tdp K1, tdp panel.12, tdp toast.1, tdp E3-33, tdp E3-34, tdp E3-37, tdp E3-35, tdp E3-36]
    remark:
      - profile 是使用者寫給 locku 的清單，算資料（tdp E3 的例子有 locku 的 profiles）
      - 舊版放在 config.yaml 的 profile，設定畫面第一次開時搬到 profiles.yaml 並說一聲；兩個檔都有時用 profiles.yaml 的，config.yaml 的留著讓使用者自己合併
      - 舊的環境變數名稱（LOCKU_DATA 這類）不讀（tdp E2）
      - 值不合規則、或名字空白或重複的 profile，不算讀不了（tdp E3，v1.2.15 照 tdp #18 定的）：設定畫面啟動時把那個檔複製成 .bak（已有就 .bak.1……，不蓋掉），再用預設值重寫、拿掉不合的 profile；啟動 toast 的一列寫出檔案與備份，每一筆以 WARN 記進 App Log（tdp note.7）；同一次啟動要說的好幾則合成一個 toast，一則一列（tdp E3「同一次啟動有好幾件」，v1.2.16；E3-37）；複製失敗就不重寫，這次照預設值，啟動 toast 的一列（Error）說原因
      - config.yaml 的 profile 指到 profiles.yaml 裡沒有的 profile，不算值不合規則：值留著、不重寫、不做 .bak，這次用內建的預設；啟動 toast 的一列（Warning，App Log 一筆 WARN），沒有畫面時寫到 stderr；那一列照原樣、label 畫 Red；那個 profile 回來就又能用（tdp E3「名字指到不在的一筆」，v1.2.16，tdp #19，user 2026-11-18 選 B；E3-33 到 E3-35）。不開 error popup：開設定畫面不是 popup 的動作失敗（tdp note.6）
      - '`locku lock` 啟動時一樣複製成 .bak、重寫（tdp E3：檔案怎麼處理跟有沒有畫面無關），但有檔讀不了時不動任何檔案（tdp E3「不在 TUI 裡的畫面」，v1.2.16；E3-36）；鎖定畫面不在 TUI 裡（tdp K1、P5），沒有 toast，那句話寫在狀態列，接在已經有的說明後面'
  - id: 26
    spec: 1
    request: config.yaml 或 profiles.yaml 讀不了時，設定畫面一開就問要不要移到旁邊成 .bak、用預設值重新開始，或是離開並印出原因
    tdp: [tdp E3, tdp confirm]
    remark:
      - .bak 已經有了就是 .bak.1……，什麼都不蓋掉
  - id: 27
    spec: 1
    request: 第一次啟動不用另外設定：用預設值開設定畫面（一個 clock profile、就是啟用中的那個、沒有 PIN），第一次改了什麼才寫檔；activate 打開之前不碰 tmux、screen 與 shell rc
    tdp: [tdp E3, tdp E6]
  - id: 28
    spec: 1
    request: 'Space 列出這裡能做的事，最後一列 Global operation 通往離開；? 列出這裡的按鍵，preference、tmux、screen 的 [2] 上最前面先是每一列的說明；q 或 Ctrl-C 離開，有浮層開著時先問 Quit locku?'
    tdp: [tdp K5, tdp K6, tdp K9, tdp M2, tdp M4, tdp note.5, tdp panel.12, tdp F4]
  - id: 29
    spec: 1
    request: '`!` 開 App Log：這次開著時寫進去的每一個值、新增／改名／刪除的 profile、每一次預覽、出現過的每一則訊息，以及出了什麼錯'
    tdp: [tdp note.7, tdp F5, tdp screen.2]
  - id: 30
    spec: 1
