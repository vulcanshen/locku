    accepted: false
    reason: 'tdp 不清楚：`locku lock` 碰到讀不了的 config.yaml 照沒有 PIN 處理（螢幕保護照常、狀態列寫原因、任何鍵結束），讀不了的 profiles.yaml 用預設的 clock 照樣要 PIN。tdp E3「讀不了時」只有兩種：有畫面的「app 不在這個狀態下繼續操作，啟動時開一個 confirm」，與「沒有畫面時（不打開 app、直接印出來的指令）」不動檔案、路徑與原因寫到 stderr、非 0 結束；鎖定畫面是不在 TUI 裡的畫面（tdp P5、K1「不在 TUI 裡的畫面…app 可以自行決定（例：locku 鎖定時的螢幕保護與 PIN 框）」），兩種都不是。P5 的放行只管畫面與按鍵，還是也包括讀不了時照樣鎖、照樣用預設值，tdp 沒寫'
